name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test
      - run: bun run build

      # npm is published *before* semantic-release creates the tag and the GitHub
      # release. If the registry publish fails, nothing was tagged yet and the
      # next run can simply retry; if it succeeds but a later step fails, the
      # publish step skips the already-published version, so the run stays
      # idempotent instead of forking the npm version from the git tag.
      - name: Compute next version
        id: next
        run: |
          output=$(bunx semantic-release --dry-run --no-ci 2>&1 || true)
          echo "$output"
          version=$(printf '%s\n' "$output" | grep -oE 'The next release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -n "$version" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tarball before tagging
        if: steps.next.outputs.release == 'true'
        working-directory: apps/server
        run: |
          bun ../../scripts/bump-version.ts "${{ steps.next.outputs.version }}"
          bun ../../scripts/npm-pack.ts
          if npm view "@seaveyon/harness-switch@${{ steps.next.outputs.version }}" version >/dev/null 2>&1; then
            echo "version ${{ steps.next.outputs.version }} already published; skipping"
          else
            npm publish ./*.tgz --access public
          fi
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Create tag, changelog and GitHub release
        if: steps.next.outputs.release == 'true'
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
